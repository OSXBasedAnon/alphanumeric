name: OSV Dependency Scan

on:
  push:
  pull_request:
  schedule:
    - cron: "17 11 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    # The called workflow declares these at workflow level, and a caller cannot grant
    # a called workflow more than it holds itself. Without them the run is rejected
    # before any step executes (startup_failure), which reads as a broken gate rather
    # than a clean scan. Still read-only apart from security-events, and SARIF upload
    # is off, so nothing is published.
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
    with:
      scan-args: |-
        --lockfile=./Cargo.lock
      fail-on-vuln: true
      upload-sarif: false
