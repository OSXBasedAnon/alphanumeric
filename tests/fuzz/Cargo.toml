[package]
name = "alphanumeric-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
alphanumeric = { path = "../..", default-features = false }

[[bin]]
name = "codec_decode"
path = "fuzz_targets/codec_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "transaction_decode"
path = "fuzz_targets/transaction_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "block_decode"
path = "fuzz_targets/block_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "store_ops"
path = "fuzz_targets/store_ops.rs"
test = false
doc = false
bench = false
